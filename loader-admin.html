html,body{height:100%;margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;}
body{display:flex;align-items:center;justify-content:center;background:#0d0d0d;color:#fff;text-align:center;}

<body>
<div>
<p>ERP Hero ist umgezogen.</p>
<p><a href="https://erp-hero-production.up.railway.app/">Weiter zu ERP Hero</a></p>
</div>
<script>
// ERP Hero läuft nur noch auf Railway. Die alte Kopie von index.html aus dem Loader-Cache wird gelöscht, ebenso die
// Val.town-Sitzung und der Login-Key, die die alte App hier gespeichert hat.
try {
  Object.keys(localStorage).forEach(function (k) {
    if (k.indexOf('app_cache_') === 0) localStorage.removeItem(k);
  });
} catch (e) {}
['session_token_p_1778057282571', 'user_key_p_1778057282571'].forEach(function (k) {
  try { localStorage.removeItem(k); } catch (e) {}
  try { sessionStorage.removeItem(k); } catch (e) {}
});
location.replace('https://erp-hero-production.up.railway.app/' + location.hash);
</script>
</body>
